[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea2prior"
version = "0.1.0"
description = "Research idea retrieval, evidence review, and Top 5 scholarly ranking"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "smolagents[litellm]>=1.23,<2", "litellm>=1.80.5,<2", "requests>=2.32.5,<3",
  "loguru>=0.7.3,<1", "PyMuPDF>=1.26.6,<2", "rank-bm25>=0.2.2,<1",
  "pydantic>=2.12.4,<3", "ddgs>=9.9.3,<10",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]
test = ["pytest>=8,<10"]

[project.scripts]
idea2prior = "paperarena.__main__:main"
paperarena = "paperarena.__main__:main"

[tool.setuptools]
packages = ["idea2prior", "paperarena", "pipelines", "pipelines.clients", "pipelines.tasks", "tools", "paperarena_benchmarks", "paperarena_prompts"]

[tool.setuptools.package-dir]
paperarena_benchmarks = "datasets"
paperarena_prompts = "prompts"

[tool.setuptools.package-data]
paperarena = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
paperarena_benchmarks = ["README.md", "README.zh-CN.md", "*/README.md", "*/manifest.json", "*/queries.jsonl", "*/gold.jsonl", "*/prompts/*.txt", "*/results/*.md", "*/results/*.txt", "*/results/*.json", "*/results/idea2prior_expert/*.json"]
paperarena_prompts = ["*.txt"]
